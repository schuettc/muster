name: CI
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - uses: extractions/setup-just@v4
      - name: Cache golangci-lint binary
        id: cache-golangci
        uses: actions/cache@v6
        with:
          path: ~/go/bin/golangci-lint
          key: golangci-lint-v2.12.2-${{ runner.os }}
      - name: Install golangci-lint
        # Pinned + installed via the Go toolchain: deterministic and avoids the
        # install.sh 'latest' checksum-verify flakiness. Keep this version in
        # sync with the version developers run locally. Skipped on a cache hit —
        # the compile is slow, the pinned binary never changes for a given key.
        if: steps.cache-golangci.outputs.cache-hit != 'true'
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - name: Verify
        run: just verify

  # The DynamoDB backend's real semantics — conditional writes, atomic
  # counters, transactions, the exactly-one idempotency claim — need an actual
  # endpoint, so those tests SKIP without one. `just verify` above must stay
  # fast and container-free, which means it can compile and vet them but never
  # run them. This job is where they run: a separate gate, not a replacement.
  #
  # It covers both the backend's own package and the cross-backend conformance
  # suite, whose DynamoDB half is the only thing proving the two
  # implementations agree.
  dynamo:
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local
        ports: ["8000:8000"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      # amazon/dynamodb-local declares no HEALTHCHECK, so the runner reports
      # the container "started" the moment it is created — before the JVM is
      # listening. Without this the job leans on `go test`'s compile time as an
      # accidental delay. Mirrors the wait in the justfile's verify-dynamo.
      - name: Wait for DynamoDB Local
        run: |
          for _ in $(seq 1 30); do
            curl -s http://localhost:8000 >/dev/null 2>&1 && exit 0
            sleep 0.5
          done
          echo "DynamoDB Local never answered on :8000" >&2
          exit 1
      # -v plus the SKIP check below is the point of this job. These tests
      # SKIP themselves when MUSTER_DDB_ENDPOINT is unset, and for a long time
      # nothing ran them and nothing said so — a green check meant nothing.
      # If the env var is ever renamed in code without updating it here, the
      # whole suite silently reverts to skipping; failing on `--- SKIP` is what
      # turns that back into a red build. Nothing else in these two packages
      # skips, so the guard has no legitimate exceptions to carve out.
      #
      # If you land a test here that skips for a GOOD reason, allowlist that one
      # test name below — do not delete this check. Deleting it restores the
      # exact silent-green regression it exists to prevent, and the next person
      # to notice will be whoever debugs a backend bug CI said was covered.
      - name: DynamoDB backend + conformance tests
        shell: bash
        env:
          MUSTER_DDB_ENDPOINT: http://localhost:8000
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/dynamo-test.log"
          go test -race -v ./internal/dynamostore/... ./internal/storetest/... 2>&1 | tee "$log"
          if grep -q -- '--- SKIP' "$log"; then
            echo "::error::DynamoDB tests SKIPPED — they did not actually run" >&2
            grep -- '--- SKIP' "$log" >&2
            exit 1
          fi
